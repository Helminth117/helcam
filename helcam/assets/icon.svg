    <rect x="20" y="14" width="5" height="36" rx="2.5"/>
    <rect x="27" y="10" width="5" height="40" rx="2.5" opacity=".9"/>
    <rect x="34" y="16" width="5" height="34" rx="2.5" opacity=".7"/>
    <rect x="41" y="22" width="5" height="28" rx="2.5" opacity=".45"/>
  </g>
  <g fill="#6cc6ff" opacity=".85">
    <rect x="14" y="20" width="2" height="22" rx="1"/>
    <rect x="49" y="12" width="2" height="18" rx="1"/>
    <rect x="52" y="34" width="2" height="14" rx="1"/>
  </g>
